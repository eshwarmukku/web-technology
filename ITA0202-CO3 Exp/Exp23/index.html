<!DOCTYPE html>
<html>
<head>
    <title>Interactive Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
            text-align: center;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            color: #333;
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        #eventTitle {
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 id="eventTitle"
        onmouseover="mouseOverEvent()"
        onmouseout="mouseOutEvent()">
        College Tech Fest
    </h1>

    <form id="registrationForm">

        <input type="text"
               id="name"
               placeholder="Enter Student Name"
               onfocus="focusEvent(this)"
               onblur="blurEvent(this)"
               oninput="inputEvent(this)">

        <input type="text"
               id="registerNo"
               placeholder="Enter Register Number">

        <input type="email"
               id="email"
               placeholder="Enter Email">

        <select id="event">
            <option value="">Select Event</option>
            <option value="Coding Contest">Coding Contest</option>
            <option value="Web Design">Web Design</option>
            <option value="Quiz">Technical Quiz</option>
            <option value="Paper Presentation">Paper Presentation</option>
        </select>

        <br>

        <button type="button" onclick="buttonClick()">
            Click Me
        </button>

        <button type="submit">
            Register
        </button>

    </form>

    <p id="message"></p>

</div>

<script>

    // onclick - Intrinsic event handling
    function buttonClick() {
        document.getElementById("message").textContent =
            "Button clicked!";
    }

    // focus event
    function focusEvent(element) {
        element.style.backgroundColor = "lightyellow";
    }

    // blur event
    function blurEvent(element) {
        element.style.backgroundColor = "white";
    }

    // input event
    function inputEvent(element) {
        document.getElementById("message").textContent =
            "Typing: " + element.value;
    }

    // mouseover event
    function mouseOverEvent() {
        document.getElementById("eventTitle").style.color = "blue";
    }

    // mouseout event
    function mouseOutEvent() {
        document.getElementById("eventTitle").style.color = "black";
    }


    // change event using addEventListener()
    document.getElementById("event").addEventListener("change", function() {

        document.getElementById("message").textContent =
            "Selected Event: " + this.value;

    });


    // submit event using addEventListener()
    document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let regno = document.getElementById("registerNo").value;
            let email = document.getElementById("email").value;
            let selectedEvent = document.getElementById("event").value;

            if (name == "" || regno == "" ||
                email == "" || selectedEvent == "") {

                document.getElementById("message").textContent =
                    "Please fill all the details.";

            } else {

                document.getElementById("message").textContent =
                    "Registration Successful for " + name +
                    " - " + selectedEvent;
            }

        });

</script>

</body>
</html>
