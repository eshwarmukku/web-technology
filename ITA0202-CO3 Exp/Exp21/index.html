<!DOCTYPE html>
<html>
<head>
    <title>DOM-Based Student Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .profile {
            width: 400px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        #profileHeading {
            color: #333;
        }

        #profileText {
            font-size: 18px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #333;
            color: white;
        }

        button:hover {
            background-color: #555;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="profile" id="studentProfile">

        <h1 id="profileHeading">Student Profile</h1>

        <p id="profileText">
            Name: Hari Prasad<br>
            Department: Computer Science<br>
            Year: II Year
        </p>

        <button onclick="changeHeading()">Change Heading</button>
        <button onclick="changeTextColor()">Text Colour</button>
        <button onclick="changeBackground()">Background Colour</button>
        <button onclick="toggleProfile()">Show / Hide Profile</button>

    </div>

    <script>

        function changeHeading() {
            let heading = document.getElementById("profileHeading");
            heading.textContent = "My Student Profile";
        }

        function changeTextColor() {
            let text = document.querySelector("#profileText");
            text.style.color = "blue";
        }

        function changeBackground() {
            let profile = document.getElementById("studentProfile");
            profile.style.backgroundColor = "lightyellow";
        }

        function toggleProfile() {
            let profile = document.querySelector("#studentProfile");
            profile.classList.toggle("hidden");
        }

        let heading = document.getElementById("profileHeading");
        heading.setAttribute("title", "Student Profile Heading");

    </script>

</body>
</html>
