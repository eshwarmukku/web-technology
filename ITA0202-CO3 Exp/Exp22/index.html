<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            text-align: center;
            padding: 30px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        input, select {
            padding: 10px;
            margin: 5px;
            width: 220px;
        }

        button {
            padding: 10px 18px;
            margin: 10px 5px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .student {
            margin-top: 15px;
            padding: 15px;
            background-color: #e8f0fe;
            border-radius: 8px;
            text-align: left;
        }

        .removeBtn {
            float: right;
            background-color: #d9534f;
            padding: 7px 12px;
        }

        #studentList {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <input type="text" id="studentName" placeholder="Student Name">
    <br>

    <input type="text" id="registerNumber" placeholder="Register Number">
    <br>

    <select id="department">
        <option value="">Select Department</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Information Technology">Information Technology</option>
        <option value="Electronics">Electronics</option>
        <option value="Mechanical">Mechanical</option>
    </select>
    <br>

    <button onclick="addStudent()">Add Student</button>
    <button onclick="clearAll()">Clear All</button>

    <div id="studentList"></div>

</div>

<script>

function addStudent() {

    let name = document.getElementById("studentName").value;
    let regno = document.getElementById("registerNumber").value;
    let dept = document.getElementById("department").value;

    if (name == "" || regno == "" || dept == "") {
        alert("Please enter all details");
        return;
    }

    // Create student container
    let student = document.createElement("div");
    student.classList.add("student");

    // Create student details
    let details = document.createElement("span");

    details.textContent =
        "Name: " + name +
        " | Register Number: " + regno +
        " | Department: " + dept;

    // Create remove button
    let removeButton = document.createElement("button");

    removeButton.textContent = "Remove";
    removeButton.classList.add("removeBtn");

    removeButton.onclick = function() {
        student.remove();
    };

    // Add details and button to student
    student.appendChild(details);
    student.appendChild(removeButton);

    // Add student to list
    document.getElementById("studentList").appendChild(student);

    // Clear input fields
    document.getElementById("studentName").value = "";
    document.getElementById("registerNumber").value = "";
    document.getElementById("department").value = "";
}

function clearAll() {

    let list = document.getElementById("studentList");

    while (list.children.length > 0) {
        list.children[0].remove();
    }
}

</script>

</body>
</html>
